name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: echo "modules=$(ls -d modules/*/ | sed 's:/$::' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  module:
    name: ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Format
        run: tofu fmt -check -recursive
        working-directory: ${{ matrix.module }}
      - name: Init
        run: tofu init -backend=false
        working-directory: ${{ matrix.module }}
      - name: Validate
        run: tofu validate
        working-directory: ${{ matrix.module }}
      - name: Test # testing is currently not implimented
        run: tofu test
        working-directory: ${{ matrix.module }}
      - uses: terraform-linters/setup-tflint@v6.3.0
      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: ${{ matrix.module }}
      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.20.0/terraform-docs-v0.20.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/
      - name: Check documentation is current
        run: |
          terraform-docs markdown table --output-file README.md --output-mode inject .
          git diff --exit-code README.md
        working-directory: ${{ matrix.module }}
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b
        with:
          extra_args: --results=verified,unknown
